# Guarda este archivo en tu repositorio como:
# .github/workflows/build-apk.yml
# (GitHub lo detecta automaticamente y compila la app en cada push o tag)

name: Build APK Beta

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de version release
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SolAgro-beta-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
  
build-windows:
    runs-on: windows-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar dependencias
        run: flutter pub get
        
      - name: Compilar los archivos base de Windows
        run: flutter build windows --release
        
      - name: Empaquetar en un Instalador (.exe)
        run: dart run inno_bundle:build
        
      - name: Subir Instalador
        uses: actions/upload-artifact@v4
        with:
          name: SolAgro-Instalador-Windows
          path: build/windows/innosetup/*.exe

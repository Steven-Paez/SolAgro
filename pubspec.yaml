name: tabla_periodica_agro
description: Tabla periódica interactiva para ingeniería agronómica. Funciona sin internet.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.0
  file_picker: ^13.1.0
  shared_preferences: ^2.2.0
  flutter_launcher_icons: "^0.13.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  inno_bundle: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
